services:
  postgres:
    image: postgres:17.6@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
    environment:
      POSTGRES_DB: facts_engine
      POSTGRES_PASSWORD: development
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d facts_engine"]
      interval: 2s
      timeout: 2s
      retries: 15
  openfga:
    image: openfga/openfga:v1.8.16@sha256:1e84deddc7c84de8344f3eb0d443c5439666198b68ac37c24fd76fd2e8c1f629
    command: ["run", "--datastore-engine", "memory"]
    ports:
      - "127.0.0.1:58080:8080"
