syntax = "proto3";
package memory.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "memory/v1/common.proto";
import "memory/v1/contexts.proto";
import "memory/v1/memories.proto";

option go_package = "github.com/caxqueiroz/facts_engine/gen/memory/v1;memoryv1";
service ExtractionService {
  rpc ScanMemoryRefresh(ScanMemoryRefreshRequest) returns (ScanMemoryRefreshResponse);
  rpc StartMemoryRefreshSweep(StartMemoryRefreshSweepRequest) returns (StartMemoryRefreshSweepResponse);
  rpc StartExtraction(StartExtractionRequest) returns (StartExtractionResponse);
  rpc PlanExtractionChunks(PlanExtractionChunksRequest) returns (PlanExtractionChunksResponse);
  rpc GetJob(GetJobRequest) returns (GetJobResponse);
  rpc RetryJob(RetryJobRequest) returns (RetryJobResponse);
  rpc GetExtractionRun(GetExtractionRunRequest) returns (GetExtractionRunResponse);
  rpc StartMemoryRefresh(StartMemoryRefreshRequest) returns (StartMemoryRefreshResponse);
}
message ExtractionInputRange {
  option (buf.validate.message).cel = {
    id: "extraction_range.order"
    message: "end must exceed start"
    expression: "this.end > this.start"
  };
  string evidence_id = 1 [(buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$"];
  int64 start = 2 [(buf.validate.field).int64.gte = 0];
  int64 end = 3 [(buf.validate.field).int64.gt = 0];
}
message PredicateBinding {
  string predicate = 1 [(buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$"];
  string schema_version = 2 [(buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$"];
}
message MemoryExtractionTarget {
  string id = 1 [(buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$"];
  string subtype = 2 [(buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$"];
  string schema_version = 3 [(buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$"];
  repeated MemoryDependency dependencies = 4 [(buf.validate.field).repeated.max_items = 64];
}
message StartExtractionRequest {
  option (buf.validate.message).cel = {
    id: "extraction.mode"
    message: "select either facts or memories"
    expression: "(size(this.memory_targets) > 0 && size(this.subjects) == 0 && size(this.predicates) == 0) || (size(this.memory_targets) == 0 && size(this.subjects) > 0 && size(this.predicates) > 0)"
  };
  string tenant = 1 [(buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$"];
  Command command = 2 [(buf.validate.field).required = true];
  string scope = 3 [(buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$"];
  string conversation_id = 4 [(buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$"];
  string profile_id = 5 [(buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$"];
  repeated string subjects = 6 [(buf.validate.field).repeated = {
    max_items: 64
    unique: true
    items: {
      string: {pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$"}
    }
  }];
  repeated PredicateBinding predicates = 7 [(buf.validate.field).repeated.max_items = 64];
  repeated MemoryExtractionTarget memory_targets = 8 [(buf.validate.field).repeated.max_items = 64];
  repeated ExtractionInputRange input_ranges = 9 [(buf.validate.field).repeated.max_items = 256];
  repeated string redacted_evidence_ids = 10 [(buf.validate.field).repeated = {
    max_items: 128
    unique: true
    items: {
      string: {pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$"}
    }
  }];
  string expected_profile_digest = 11 [(buf.validate.field).string.pattern = "^([a-f0-9]{64})?$"];
}
message StartExtractionResponse {
  JobStatus job = 1;
}
message PlanExtractionChunksRequest {
  string tenant = 1 [(buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$"];
  string scope = 2 [(buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$"];
  string conversation_id = 3 [(buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$"];
  string profile_id = 4 [(buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$"];
  string purpose = 5 [(buf.validate.field).string = {
    min_bytes: 1
    max_bytes: 256
  }];
  int32 max_source_bytes = 6 [(buf.validate.field).int32.gte = 4];
  repeated ExtractionInputRange input_ranges = 7 [(buf.validate.field).repeated.max_items = 256];
  repeated string redacted_evidence_ids = 8 [(buf.validate.field).repeated = {
    max_items: 128
    unique: true
    items: {
      string: {pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$"}
    }
  }];
}
message PlanExtractionChunksResponse {
  ExtractionChunkPlan plan = 1;
}
message ExtractionChunkPlan {
  string version = 1;
  string tenant = 2;
  string scope = 3;
  string conversation_id = 4;
  string conversation_digest = 5;
  string profile_id = 6;
  string profile_digest = 7;
  int64 max_source_bytes = 8;
  repeated ExtractionChunk chunks = 9;
  repeated ExtractionInputRange excluded_ranges = 10;
  repeated string redacted_evidence_ids = 11;
}
message ExtractionChunk {
  repeated ExtractionInputRange input_ranges = 1;
  int64 source_bytes = 2;
}
message GetJobRequest {
  string tenant = 1 [(buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$"];
  string scope = 2 [(buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$"];
  string id = 3 [(buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$"];
  string purpose = 4 [(buf.validate.field).string = {
    min_bytes: 1
    max_bytes: 256
  }];
}
message GetExtractionRunRequest {
  string tenant = 1 [(buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$"];
  string scope = 2 [(buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$"];
  string id = 3 [(buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$"];
  string purpose = 4 [(buf.validate.field).string = {
    min_bytes: 1
    max_bytes: 256
  }];
}
message GetJobResponse {
  JobStatus job = 1;
}
message GetExtractionRunResponse {
  ExtractionRun run = 1;
}
message RetryJobRequest {
  string tenant = 1 [(buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$"];
  Command command = 2 [(buf.validate.field).required = true];
  string scope = 3 [(buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$"];
  string id = 4 [(buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$"];
  int64 expected_fence = 5 [(buf.validate.field).int64.gte = 0];
}
message RetryJobResponse {
  JobStatus job = 1;
}
message StartMemoryRefreshRequest {
  string tenant = 1 [(buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$"];
  Command command = 2 [(buf.validate.field).required = true];
  string scope = 3 [(buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$"];
  string record_id = 4 [(buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$"];
  string version_id = 5 [(buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$"];
  string profile_id = 6 [(buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$"];
  MemoryRefreshTrigger trigger = 7;
}
message MemoryRefreshTrigger {
  string event_id = 1 [(buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$"];
  int64 ledger_revision = 2 [(buf.validate.field).int64.gt = 0];
}
message StartMemoryRefreshResponse {
  JobStatus job = 1;
}
message JobStatus {
  string id = 1;
  string scope = 2;
  string kind = 3;
  string state = 4;
  string attempt_id = 5;
  string last_failure_code = 6;
  string purpose = 7;
  int64 attempts = 8;
  int64 max_attempts = 9;
  int64 fence = 10;
  int64 created_revision = 11;
  google.protobuf.Timestamp available_at = 12;
  google.protobuf.Timestamp lease_until = 13;
}
message ExtractionRun {
  ExtractionAttempt attempt = 1;
  ExtractionResult result = 2;
}
// Retained artifacts are exact provider request/response bytes. Worker ownership
// nonces are internal and are not part of the remote inspection contract.
message ExtractionAttempt {
  string id = 1;
  string tenant = 2;
  string scope = 3;
  string job_id = 4;
  string profile_digest = 5;
  string request_digest = 6;
  Caller caller = 7;
  int64 fence = 8;
  int64 ledger_revision = 9;
  google.protobuf.Timestamp lease_until = 10;
  int64 number = 11;
  google.protobuf.Timestamp started_at = 12;
  bytes request_bytes = 13;
  repeated AuthorizationDecision authorization = 14;
  repeated string content_scopes = 15;
  repeated string refresh_scopes = 16;
  ExtractionReservation reservation = 17;
}
message ExtractionReservation {
  string day = 1;
  int64 tokens = 2;
  int64 daily_token_limit = 3;
  int64 concurrent_limit = 4;
  string cost_unit = 5;
  int64 cost_units = 6;
  int64 daily_cost_limit = 7;
}
message ExtractionResult {
  string attempt_id = 1;
  string job_id = 2;
  string tenant = 3;
  string scope = 4;
  string outcome = 5;
  string model_identity = 6;
  string request_digest = 7;
  string response_digest = 8;
  bytes response_bytes = 9;
  bool response_complete = 10;
  int64 input_tokens = 11;
  int64 output_tokens = 12;
  repeated ExtractionIssue issues = 13;
  repeated ExtractionRelation relations = 14;
  repeated ExtractedProposal proposals = 15;
  repeated AuthorizationDecision authorization = 16;
  google.protobuf.Timestamp completed_at = 17;
  int64 ledger_revision = 18;
  repeated string content_scopes = 19;
  repeated string refresh_scopes = 20;
}
message ExtractionIssue {
  int64 candidate = 1;
  string code = 2;
}
message ExtractionRelation {
  int64 candidate = 1;
  string record_id = 2;
  string version_id = 3;
  string kind = 4;
}
message ExtractedProposal {
  int64 candidate = 1;
  string record_id = 2;
  string version_id = 3;
  string record_kind = 4;
}

// Operational pages use the retained event/revision and a version-ID cursor.
message ScanMemoryRefreshRequest {
  string tenant = 1 [(buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$"];
  string scope = 2 [(buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$"];
  string purpose = 3 [(buf.validate.field).string = {
    min_bytes: 1
    max_bytes: 256
  }];
  MemoryRefreshTrigger trigger = 4 [(buf.validate.field).required = true];
  string after_version_id = 5 [(buf.validate.field).string.pattern = "^([A-Za-z0-9][A-Za-z0-9_.-]{0,127})?$"];
  int32 limit = 6 [(buf.validate.field).int32 = {
    gte: 1
    lte: 100
  }];
}
message ScanMemoryRefreshResponse {
  repeated VersionReference versions = 1;
}
// Commits a sweep event; it does not scan, execute a provider, or accept memory.
message StartMemoryRefreshSweepRequest {
  string tenant = 1 [(buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$"];
  Command command = 2 [(buf.validate.field).required = true];
  string scope = 3 [(buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$"];
  string stream = 4 [(buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$"];
  string profile_id = 5 [(buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$"];
  google.protobuf.Timestamp scheduled_for = 6 [(buf.validate.field).required = true];
  int32 interval_minutes = 7 [(buf.validate.field).int32 = {
    gte: 1
    lte: 1440
  }];
}
message StartMemoryRefreshSweepResponse {
  CommitResult result = 1;
}
