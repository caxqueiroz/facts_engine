syntax = "proto3";
package memory.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "memory/v1/common.proto";
import "memory/v1/evidence.proto";

option go_package = "github.com/caxqueiroz/facts_engine/gen/memory/v1;memoryv1";
// Administrative controls retain engine authorization and database-role checks.
// Disposal covers eligible evidence, orphan uploads, snapshots, contexts and terminal extraction artifacts.
service RetentionService {
  rpc DisposeBatch(DisposeBatchRequest) returns (DisposeBatchResponse);
  rpc DisposeAttestation(DisposeAttestationRequest) returns (DisposeAttestationResponse);
  rpc DisposeConversation(DisposeConversationRequest) returns (DisposeConversationResponse);
  rpc RegisterRetentionPolicy(RegisterRetentionPolicyRequest) returns (RegisterRetentionPolicyResponse);
  rpc PlaceLegalHold(PlaceLegalHoldRequest) returns (PlaceLegalHoldResponse);
  rpc ReleaseLegalHold(ReleaseLegalHoldRequest) returns (ReleaseLegalHoldResponse);
  rpc DisposeEvidence(DisposeEvidenceRequest) returns (DisposeEvidenceResponse);
  rpc CleanupProjection(CleanupProjectionRequest) returns (CleanupProjectionResponse);
  rpc DisposeVersion(DisposeVersionRequest) returns (DisposeVersionResponse);
  rpc DisposeExtraction(DisposeExtractionRequest) returns (DisposeExtractionResponse);
  rpc DisposeContext(DisposeContextRequest) returns (DisposeContextResponse);
  rpc DisposeSnapshot(DisposeSnapshotRequest) returns (DisposeSnapshotResponse);
  rpc DisposeOrphanEvidence(DisposeOrphanEvidenceRequest) returns (DisposeOrphanEvidenceResponse);
  rpc GetRetentionStatus(GetRetentionStatusRequest) returns (GetRetentionStatusResponse);
}
message RetentionPolicy {
  string id = 1 [(buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$"];
  string scope = 2 [(buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$"];
  string record_class = 3 [
    (buf.validate.field).string.in = "evidence_bytes",
    (buf.validate.field).string.in = "conversation_payload",
    (buf.validate.field).string.in = "orphan_evidence_bytes",
    (buf.validate.field).string.in = "snapshot_payload",
    (buf.validate.field).string.in = "context_payload",
    (buf.validate.field).string.in = "calculation_payload",
    (buf.validate.field).string.in = "decision_payload",
    (buf.validate.field).string.in = "extraction_job_payload",
    (buf.validate.field).string.in = "extraction_request_payload",
    (buf.validate.field).string.in = "extraction_response_payload",
    (buf.validate.field).string.in = "fact_payload",
    (buf.validate.field).string.in = "memory_payload",
    (buf.validate.field).string.in = "attestation_payload",
    (buf.validate.field).string.in = "conversation_payload"
  ];
  string purpose = 4 [(buf.validate.field).string = {
    min_bytes: 1
    max_bytes: 256
  }];
  string jurisdiction = 5 [(buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$"];
  int64 minimum_age_seconds = 6 [(buf.validate.field).int64 = {
    gte: 0
    lte: 3162240000
  }];
}
