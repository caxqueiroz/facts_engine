  Command command = 2 [(buf.validate.field).required = true];
  string kind = 3 [
    (buf.validate.field).string.in = "fact",
    (buf.validate.field).string.in = "memory"
  ];
  string scope = 4 [(buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$"];
  string record_id = 5 [(buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$"];
  string attestation_id = 6 [(buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$"];
  string policy_id = 7 [(buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$"];
  string jurisdiction = 8 [(buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$"];
  string purpose = 9 [(buf.validate.field).string = {
    min_bytes: 1
    max_bytes: 256
  }];
  string reason = 10 [(buf.validate.field).string = {
    min_bytes: 1
    max_bytes: 1024
  }];
  string version_id = 11 [(buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$"];
}
message DisposeAttestationResponse {
  CommitResult result = 1;
}
